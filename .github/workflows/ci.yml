name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which jobs this change needs, so a web-only change does not run
  # the Go suite (and vice versa) and a docs-only change runs nothing else.
  # Anything uncertain (new branch, force push) runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.diff.outputs.go }}
      web: ${{ steps.diff.outputs.web }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "go=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" HEAD)
          echo "$files"
          # The workflow itself and the API contract affect both sides.
          shared='^(\.github/workflows/|api/openapi\.yaml$)'
          go='^(cmd/|internal/|api/|deploy/|go\.(mod|sum)$|Dockerfile$|\.dockerignore$|\.golangci\.ya?ml$|Makefile$)'
          web='^web/'
          echo "go=$(grep -Eq "$go|$shared" <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "web=$(grep -Eq "$web|$shared" <<<"$files" && echo true || echo false)" >> "$GITHUB_OUTPUT"

  test:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      SEMAR_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: Check generated code is up to date
        run: |
          go generate ./...
          git diff --exit-code -- internal/api/gen || (echo "::error::run 'go generate ./...' and commit the result" && exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test (race)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

  lint:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Check generated API types are up to date
        run: |
          npm run gen:api
          git diff --exit-code -- src/shared/api-client/schema.gen.ts || (echo "::error::run 'npm run gen:api' in web/ and commit the result" && exit 1)
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    needs: [test, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Images are not pushed until a registry is chosen. Pull requests
      # build amd64 only to check the Dockerfile; main also builds arm64,
      # which runs under emulation and dominates the run time.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: false
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
