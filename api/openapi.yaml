openapi: 3.1.0
info:
  title: SEMAR API
  version: 0.0.0
  description: |
    Contract between the SEMAR web UI and semar-api. This file is the source of
    truth; server types will be generated from it (oapi-codegen) and CI fails
    on drift (roadmap §3.10).

    Every response carries an `X-Request-ID` header (pattern
    `^[A-Za-z0-9._-]{1,64}$`): a valid incoming value is echoed, otherwise the
    server generates one. It is set by middleware, not per operation.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        "200":
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/version:
    get:
      summary: Build information
      operationId: getVersion
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        default:
          $ref: "#/components/responses/Problem"
components:
  responses:
    Problem:
      description: Error in RFC 9457 problem details format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok, ready]
    VersionInfo:
      type: object
      required: [version, commit, goVersion, platform]
      properties:
        version:
          type: string
        commit:
          type: string
        goVersion:
          type: string
        platform:
          type: string
          examples: [linux/arm64]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
