openapi: 3.1.0
info:
  title: SEMAR API
  version: 0.0.0
  description: |
    Contract between the SEMAR web UI and semar-api. This file is the source of
    truth; server types will be generated from it (oapi-codegen) and CI fails
    on drift (roadmap §3.10).

    Every response carries an `X-Request-ID` header (pattern
    `^[A-Za-z0-9._-]{1,64}$`): a valid incoming value is echoed, otherwise the
    server generates one. It is set by middleware, not per operation.

    Authentication: `POST /api/v1/auth/login` sets the `semar_session` cookie
    (HttpOnly, SameSite=Strict). Every POST, PUT, PATCH and DELETE request must
    also send an `X-Requested-By` header (any non-empty value) as CSRF
    protection; requests without it are rejected with 403.
servers:
  - url: /
paths:
  /healthz:
    get:
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
  /readyz:
    get:
      summary: Readiness probe
      operationId: getReadyz
      responses:
        "200":
          description: All dependencies are ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Status"
        "503":
          $ref: "#/components/responses/Problem"
  /api/v1/version:
    get:
      summary: Build information
      operationId: getVersion
      responses:
        "200":
          description: Build information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Sign in with a local account
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in; the session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: Sign out and clear the session cookie
      operationId: logout
      responses:
        "204":
          description: Signed out
          headers:
            Set-Cookie:
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: The signed-in user and their role bindings
      operationId: getMe
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/sites:
    get:
      tags: [settings]
      summary: List sites
      operationId: listSites
      responses:
        "200":
          description: All sites
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SiteList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [settings]
      summary: Create a site
      operationId: createSite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SiteCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects:
    get:
      tags: [settings]
      summary: List projects
      operationId: listProjects
      responses:
        "200":
          description: All projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [settings]
      summary: Create a project
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/projects/{projectId}/mappings:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [settings]
      summary: List the provider scopes mapped to a project
      operationId: listProjectMappings
      responses:
        "200":
          description: Mappings of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMappingList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [settings]
      summary: Map a provider scope (OpenStack project, PVE pool) to the project
      description: Each external scope of a provider maps to at most one project (409 otherwise).
      operationId: createProjectMapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectMappingCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMapping"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/providers:
    get:
      tags: [settings]
      summary: List active providers
      operationId: listProviders
      responses:
        "200":
          description: Active providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [settings]
      summary: Register a provider
      description: |
        The server derives the provider fingerprint; registering the same cloud
        twice while it is active fails with 409.
      operationId: createProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderCreate"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/providers/{providerId}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      tags: [settings]
      summary: Get a provider
      operationId: getProvider
      responses:
        "200":
          description: The provider
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [settings]
      summary: Remove a provider (soft delete; history is kept)
      operationId: deleteProvider
      responses:
        "204":
          description: Removed
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/providers/{providerId}/credentials:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      tags: [settings]
      summary: List a provider's credentials (metadata only; secrets are never returned)
      operationId: listCredentials
      responses:
        "200":
          description: Credential metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CredentialList"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [settings]
      summary: Store or replace a credential (write-only)
      description: |
        The secret is sealed with envelope encryption before it reaches the
        database and is never returned by any endpoint (ADR-0004, ADR-0005).
        Allowed scopes per purpose: discovery → `provider`; mutate →
        `project:<id>` or `pool:<name>`; capi → `project:<id>`; cluster →
        `cluster:<id>`.
      operationId: putCredential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialPut"
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Credential"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [settings]
      summary: Delete a credential
      operationId: deleteCredential
      parameters:
        - name: purpose
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/CredentialPurpose"
        - name: scope
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/resources:
    get:
      tags: [inventory]
      summary: List cached inventory resources the caller may see
      description: |
        Served from SEMAR's inventory cache, never from the providers. Results
        are limited to the caller's role bindings: global admins and operators
        see everything (including resources not mapped to a project), global
        viewers see every resource that belongs to a project, and scoped
        bindings see their projects/providers. Hypervisors are visible to
        global bindings only.
      operationId: listResources
      parameters:
        - name: kind
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/ResourceKind"
        - name: providerId
          in: query
          schema:
            $ref: "#/components/schemas/EntityId"
        - name: projectId
          in: query
          schema:
            $ref: "#/components/schemas/EntityId"
        - name: siteId
          in: query
          description: Only resources of providers in this site.
          schema:
            $ref: "#/components/schemas/EntityId"
        - name: arch
          in: query
          schema:
            type: string
            enum: [amd64, arm64, unknown]
        - name: includeOrphaned
          in: query
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          description: Opaque cursor from a previous page's `nextCursor`.
          schema:
            type: string
      responses:
        "200":
          description: One page of resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceList"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/resources/{providerId}/{kind}/{externalId}:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
      - name: kind
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ResourceKind"
      - name: externalId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
    get:
      tags: [inventory]
      summary: One cached resource with its recent change history
      description: |
        Includes orphaned resources. Subject to the same visibility rules as
        GET /api/v1/resources; a resource the caller may not see answers 404.
      operationId: getResource
      responses:
        "200":
          description: Resource and its latest changes (newest first, at most 50)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/capacity:
    get:
      tags: [inventory]
      summary: Capacity Overview over the resources the caller may see
      description: |
        Aggregates SEMAR's inventory cache. VM totals cover exactly the VMs
        the caller could list with GET /api/v1/resources, so scoped callers
        never see aggregates outside their projects. Physical (hypervisor)
        capacity is included only for global bindings and only when no
        project filter is set. Orphaned resources are not counted.
      operationId: getCapacity
      parameters:
        - name: providerId
          in: query
          schema:
            $ref: "#/components/schemas/EntityId"
        - name: siteId
          in: query
          schema:
            $ref: "#/components/schemas/EntityId"
        - name: projectId
          in: query
          schema:
            $ref: "#/components/schemas/EntityId"
      responses:
        "200":
          description: Capacity summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capacity"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/providers/{providerId}/sync-status:
    parameters:
      - $ref: "#/components/parameters/ProviderId"
    get:
      tags: [inventory]
      summary: Last inventory sync outcome of a provider
      operationId: getProviderSyncStatus
      responses:
        "200":
          description: Sync status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncStatus"
        default:
          $ref: "#/components/responses/Problem"
components:
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/EntityId"
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/EntityId"
  responses:
    Problem:
      description: Error in RFC 9457 problem details format
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    ResourceKind:
      type: string
      enum: [hypervisor, vm, image, network, volume]
    Resource:
      type: object
      required: [providerId, kind, externalId, name, externalScope, arch, status, spec, observedAt, firstSeenAt]
      properties:
        providerId:
          $ref: "#/components/schemas/EntityId"
        kind:
          $ref: "#/components/schemas/ResourceKind"
        externalId:
          type: string
        name:
          type: string
        externalScope:
          type: string
          description: Provider-side owner scope (OpenStack project, PVE pool).
        projectId:
          $ref: "#/components/schemas/EntityId"
        arch:
          type: string
          enum: [amd64, arm64, unknown]
        status:
          type: string
        spec:
          type: object
          additionalProperties: true
          description: Kind-specific attributes (vcpus, memoryMiB, ipAddresses, sizeGiB, …).
        observedAt:
          type: string
          format: date-time
          description: When the provider last reported this state (data age).
        firstSeenAt:
          type: string
          format: date-time
        orphanedAt:
          type: string
          format: date-time
    ResourceChange:
      type: object
      required: [id, change, observedAt]
      properties:
        id:
          type: integer
          format: int64
        change:
          type: string
          enum: [created, updated, orphaned, restored]
        observedAt:
          type: string
          format: date-time
        projectId:
          $ref: "#/components/schemas/EntityId"
    ResourceDetail:
      type: object
      required: [resource, changes]
      properties:
        resource:
          $ref: "#/components/schemas/Resource"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/ResourceChange"
    ResourceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        nextCursor:
          type: string
    CountByKey:
      type: object
      required: [key, count]
      properties:
        key:
          type: string
        count:
          type: integer
          format: int64
    VMCapacity:
      type: object
      required: [total, vcpus, memoryMiB, byStatus, byArch]
      properties:
        total:
          type: integer
          format: int64
        vcpus:
          type: integer
          format: int64
          description: vCPUs allocated to the counted VMs.
        memoryMiB:
          type: integer
          format: int64
          description: Memory allocated to the counted VMs.
        byStatus:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
        byArch:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
    HypervisorCapacity:
      type: object
      required: [total, vcpus, vcpusUsed, memoryMiB, memoryMiBUsed, byArch]
      properties:
        total:
          type: integer
          format: int64
        vcpus:
          type: integer
          format: int64
        vcpusUsed:
          type: integer
          format: int64
        memoryMiB:
          type: integer
          format: int64
        memoryMiBUsed:
          type: integer
          format: int64
        byArch:
          type: array
          items:
            $ref: "#/components/schemas/CountByKey"
    Capacity:
      type: object
      required: [vms]
      properties:
        vms:
          $ref: "#/components/schemas/VMCapacity"
        hypervisors:
          $ref: "#/components/schemas/HypervisorCapacity"
    SyncStatus:
      type: object
      required: [providerId, status, lastAttemptAt, consecutiveFailures, lastError]
      properties:
        providerId:
          $ref: "#/components/schemas/EntityId"
        status:
          type: string
          enum: [healthy, degraded, unreachable]
        lastAttemptAt:
          type: string
          format: date-time
        lastSuccessAt:
          type: string
          format: date-time
        lastObservedAt:
          type: string
          format: date-time
        consecutiveFailures:
          type: integer
        lastError:
          type: string
    CredentialPurpose:
      type: string
      enum: [discovery, mutate, capi, cluster]
    Credential:
      type: object
      required: [id, purpose, scope, owner, kekVersion, createdAt, rotatedAt]
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/CredentialPurpose"
        scope:
          type: string
        owner:
          type: string
          description: Account that owns the credential at the provider (e.g. the service user).
        kekVersion:
          type: string
          description: Version of the key-encryption key sealing this credential.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        rotatedAt:
          type: string
          format: date-time
    CredentialPut:
      type: object
      required: [purpose, scope, secret]
      properties:
        purpose:
          $ref: "#/components/schemas/CredentialPurpose"
        scope:
          type: string
          examples: [provider, "project:0a1b2c3d", "pool:payment"]
        owner:
          type: string
        expiresAt:
          type: string
          format: date-time
        secret:
          type: object
          writeOnly: true
          minProperties: 1
          maxProperties: 32
          additionalProperties:
            type: string
          description: |
            Provider-specific secret fields, e.g. OpenStack
            `{"application_credential_id": "...", "application_credential_secret": "..."}`
            or Proxmox `{"token_id": "user@realm!name", "token_secret": "..."}`.
    CredentialList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Credential"
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
          format: password
    Role:
      type: string
      enum: [admin, operator, viewer]
    RoleBinding:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"
        projectId:
          $ref: "#/components/schemas/EntityId"
        providerId:
          $ref: "#/components/schemas/EntityId"
    Me:
      type: object
      required: [username, roles]
      properties:
        username:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleBinding"
    EntityId:
      type: string
      pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
      examples: [os-jkt]
    Site:
      type: object
      required: [id, name, labels, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        name:
          type: string
        labels:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SiteCreate:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        name:
          type: string
          minLength: 1
        labels:
          type: object
          additionalProperties:
            type: string
    SiteList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Site"
    Project:
      type: object
      required: [id, name, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      required: [id, name]
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        name:
          type: string
          minLength: 1
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    ProjectMapping:
      type: object
      required: [id, projectId, providerId, externalScope, createdAt]
      properties:
        id:
          type: integer
          format: int64
        projectId:
          $ref: "#/components/schemas/EntityId"
        providerId:
          $ref: "#/components/schemas/EntityId"
        externalScope:
          type: string
          description: OpenStack project ID, "pool:<name>" for a PVE pool, …
        createdAt:
          type: string
          format: date-time
    ProjectMappingCreate:
      type: object
      required: [providerId, externalScope]
      properties:
        providerId:
          $ref: "#/components/schemas/EntityId"
        externalScope:
          type: string
          minLength: 1
    ProjectMappingList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMapping"
    ProviderType:
      type: string
      enum: [openstack, proxmox, fake]
    Provider:
      type: object
      required: [id, type, name, endpoints, regionName, fingerprint, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        type:
          $ref: "#/components/schemas/ProviderType"
        name:
          type: string
        siteId:
          $ref: "#/components/schemas/EntityId"
        endpoints:
          type: array
          items:
            type: string
        regionName:
          type: string
        fingerprint:
          type: string
          description: Stable identity of the backing cloud, derived by the server.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProviderCreate:
      type: object
      required: [id, type, name, endpoints]
      properties:
        id:
          $ref: "#/components/schemas/EntityId"
        type:
          $ref: "#/components/schemas/ProviderType"
        name:
          type: string
          minLength: 1
        siteId:
          $ref: "#/components/schemas/EntityId"
        endpoints:
          type: array
          minItems: 1
          items:
            type: string
            format: uri
          description: Keystone URL, or the API URLs of every node of one PVE cluster.
        regionName:
          type: string
          description: OpenStack region; empty for Proxmox.
    ProviderList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Provider"
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string
          examples: [ok, ready]
    VersionInfo:
      type: object
      required: [version, commit, goVersion, platform]
      properties:
        version:
          type: string
        commit:
          type: string
        goVersion:
          type: string
        platform:
          type: string
          examples: [linux/arm64]
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        requestId:
          type: string
