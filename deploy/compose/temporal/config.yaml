# enable-template
# Temporal server config for the SEMAR Lite profile (development only).
# Rendered by temporal-server with environment variables (see compose file).
log:
  stdout: true
  level: {{ default "warn" (env "TEMPORAL_LOG_LEVEL") }}

persistence:
  defaultStore: default
  visibilityStore: visibility
  numHistoryShards: 4
  datastores:
    default:
      sql:
        pluginName: postgres12
        databaseName: temporal
        connectAddr: "{{ env "POSTGRES_SEEDS" }}:5432"
        connectProtocol: tcp
        user: "{{ env "POSTGRES_USER" }}"
        password: "{{ env "POSTGRES_PWD" }}"
        maxConns: 20
        maxIdleConns: 20
        maxConnLifetime: 1h
    visibility:
      sql:
        pluginName: postgres12
        databaseName: temporal_visibility
        connectAddr: "{{ env "POSTGRES_SEEDS" }}:5432"
        connectProtocol: tcp
        user: "{{ env "POSTGRES_USER" }}"
        password: "{{ env "POSTGRES_PWD" }}"
        maxConns: 10
        maxIdleConns: 10
        maxConnLifetime: 1h

global:
  membership:
    maxJoinDuration: 30s
    broadcastAddress: "{{ env "BIND_ON_IP" }}"

services:
  frontend:
    rpc:
      grpcPort: 7233
      membershipPort: 6933
      bindOnIP: 0.0.0.0
      httpPort: 7243
  matching:
    rpc:
      grpcPort: 7235
      membershipPort: 6935
      bindOnIP: 0.0.0.0
  history:
    rpc:
      grpcPort: 7234
      membershipPort: 6934
      bindOnIP: 0.0.0.0
  worker:
    rpc:
      grpcPort: 7239
      membershipPort: 6939
      bindOnIP: 0.0.0.0

clusterMetadata:
  enableGlobalNamespace: false
  failoverVersionIncrement: 10
  masterClusterName: active
  currentClusterName: active
  clusterInformation:
    active:
      enabled: true
      initialFailoverVersion: 1
      rpcName: frontend
      rpcAddress: "{{ env "BIND_ON_IP" }}:7233"
      httpAddress: "{{ env "BIND_ON_IP" }}:7243"

dcRedirectionPolicy:
  policy: noop

archival:
  history:
    state: disabled
  visibility:
    state: disabled

namespaceDefaults:
  archival:
    history:
      state: disabled
    visibility:
      state: disabled

dynamicConfigClient:
  filepath: /etc/temporal/dynamicconfig.yaml
  pollInterval: 60s
